<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 周杰倫</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --text: #e8e0d0;
      --text-muted: #7a7268;
      --jay: #c9a84c;
      --user: #4a7c9e;
      --border: rgba(201, 168, 76, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif TC', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(201,168,76,0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(74,124,158,0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0 16px;
    }

    /* Header */
    header {
      padding: 28px 0 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e1a0e, #3a2e10);
      border: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(201,168,76,0.2);
    }

    .header-info h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.02em;
    }

    .header-info p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      font-style: italic;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4caf82;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface2) transparent;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

    /* Welcome message */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 0.3s;
    }

    .welcome .big-quote {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      color: var(--gold);
      opacity: 0.3;
      line-height: 1;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .welcome .hint {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .hint-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .hint-chip:hover {
      border-color: var(--gold);
      color: var(--gold-light);
    }

    /* Messages */
    .msg {
      display: flex;
      gap: 12px;
      opacity: 0;
      animation: slideUp 0.35s ease forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg.jay .msg-avatar {
      background: linear-gradient(135deg, #1e1a0e, #3a2e10);
      border: 1px solid var(--gold);
      box-shadow: 0 0 12px rgba(201,168,76,0.15);
    }

    .msg.user .msg-avatar {
      background: var(--surface2);
      border: 1px solid rgba(74,124,158,0.4);
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.7;
    }

    .msg.jay .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text);
    }

    .msg.user .bubble {
      background: var(--surface2);
      border: 1px solid rgba(74,124,158,0.25);
      border-top-right-radius: 4px;
      color: var(--text);
    }

    /* Typing indicator */
    .typing .bubble {
      padding: 14px 18px;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.4;
      animation: blink 1.2s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* Input area */
    .input-area {
      padding: 16px 0 24px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }

    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
      opacity: 0.7;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Noto Serif TC', serif;
      font-size: 15px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      min-height: 48px;
      max-height: 120px;
      line-height: 1.5;
    }

    #input::placeholder { color: var(--text-muted); }
    #input:focus { border-color: rgba(201,168,76,0.4); }

    #send {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2a2210, #3d3118);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    #send:hover { background: linear-gradient(135deg, #3d3118, #524220); box-shadow: 0 0 16px rgba(201,168,76,0.25); }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }

    #send svg { width: 20px; height: 20px; }

    /* Music note decoration */
    .note {
      position: fixed;
      font-size: 14px;
      opacity: 0;
      color: var(--gold);
      animation: floatNote 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatNote {
      0% { opacity: 0; transform: translateY(0) rotate(0deg); }
      20% { opacity: 0.15; }
      80% { opacity: 0.15; }
      100% { opacity: 0; transform: translateY(-60px) rotate(15deg); }
    }
  </style>
</head>
<body>

<div class="note" style="left:8%;top:30%;animation-delay:0s">♩</div>
<div class="note" style="left:92%;top:50%;animation-delay:1.5s">♪</div>
<div class="note" style="left:5%;top:70%;animation-delay:3s">♫</div>
<div class="note" style="left:95%;top:20%;animation-delay:2s">♬</div>

<div class="wrapper">
  <header>
    <div class="avatar">🎵</div>
    <div class="header-info">
      <h1>周杰倫 · AI</h1>
      <p>不是真實本人，是 AI 模擬</p>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      線上
    </div>
  </header>

  <div id="chat">
    <div class="welcome">
      <div class="big-quote">"</div>
      <p>嗨，我是 AI 版的周杰倫啦<br/>有什麼想聊的，說吧</p>
      <div class="hint">
        <span class="hint-chip" onclick="sendHint('你最喜歡自己哪首歌？')">你最喜歡自己哪首歌？</span>
        <span class="hint-chip" onclick="sendHint('創作靈感怎麼來的？')">創作靈感怎麼來的？</span>
        <span class="hint-chip" onclick="sendHint('最近有在打籃球嗎？')">最近有在打籃球嗎？</span>
        <span class="hint-chip" onclick="sendHint('跟方文山怎麼合作的？')">跟方文山怎麼合作的？</span>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="disclaimer">⚠️ AI 模擬，非真實周杰倫本人</div>
    <div class="input-row">
      <textarea id="input" placeholder="跟 Jay 說點什麼⋯⋯" rows="1"></textarea>
      <button id="send" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let history = [];
  let isLoading = false;

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  function addMessage(role, text) {
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();

    const isJay = role === 'assistant';
    const div = document.createElement('div');
    div.className = `msg ${isJay ? 'jay' : 'user'}`;
    div.innerHTML = `
      <div class="msg-avatar">${isJay ? '🎵' : '👤'}</div>
      <div class="bubble">${text.replace(/\n/g, '<br/>')}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg jay typing';
    div.id = 'typing';
    div.innerHTML = `
      <div class="msg-avatar">🎵</div>
      <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage(text) {
    const msg = text || input.value.trim();
    if (!msg || isLoading) return;

    input.value = '';
    input.style.height = 'auto';
    isLoading = true;
    sendBtn.disabled = true;

    addMessage('user', msg);
    history.push({ role: 'user', content: msg });
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addMessage('assistant', `哎⋯⋯出了點問題：${data.error || '不知道啦'}`);
        history.pop();
      } else {
        addMessage('assistant', data.reply);
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch (err) {
      removeTyping();
      addMessage('assistant', '欸，網路好像有點問題⋯⋯');
      history.pop();
    }

    isLoading = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function sendHint(text) {
    sendMessage(text);
  }
</script>
</body>
</html>
