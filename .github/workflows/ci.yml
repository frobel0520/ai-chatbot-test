name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check syntax
        run: node --check server.js

      # 不需要 OPENROUTER_API_KEY：只驗證伺服器能啟動、首頁可讀、錯誤格式的請求被擋下。
      - name: Smoke test
        run: |
          PORT=3123 node server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID; cat server.log' EXIT
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:3123/ && break
            sleep 0.5
          done
          page=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3123/)
          bad=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:3123/api/chat)
          echo "GET / -> $page, POST /api/chat {} -> $bad"
          test "$page" = 200
          test "$bad" = 400
